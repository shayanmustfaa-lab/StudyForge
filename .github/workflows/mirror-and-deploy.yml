name: Deploy StudyForge

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/mirror-and-deploy.yml'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: studyforge-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Integrate Study Center without changing base UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')
          head = '<link rel="manifest" href="/StudyForge/manifest.webmanifest"/><meta name="theme-color" content="#6f54ed"/><link rel="stylesheet" href="/StudyForge/study-center.css?v=5"/><link rel="stylesheet" href="/StudyForge/study-center-fix.css?v=2"/>'
          loader = '<script defer src="/StudyForge/study-center.js?v=5"></script>'
          if '/StudyForge/manifest.webmanifest' not in s:
              s = s.replace('</head>', head + '</head>')
          if '/StudyForge/study-center.js' not in s:
              s = s.replace('</body>', loader + '</body>')
          p.write_text(s, encoding='utf-8')
          q = Path('site/404.html')
          if q.exists():
              q.write_text(s, encoding='utf-8')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy StudyForge
        id: deployment
        uses: actions/deploy-pages@v4
